<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400" role="img" aria-labelledby="title desc">
  <title id="title">FOCUS-OVD 模型示意图</title>
  <desc id="desc">中文模型示意图。中心突出方向感知模块，整体分为图像前向流、原生 support 分支、方向条件残差适配器、训练与安全验证四部分。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="15" markerHeight="15" refX="13" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,13 L14,6.5 z" fill="#0369a1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="15" markerHeight="15" refX="13" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,13 L14,6.5 z" fill="#15803d"/>
    </marker>
    <marker id="arrowDark" markerWidth="15" markerHeight="15" refX="13" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,13 L14,6.5 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowRed" markerWidth="15" markerHeight="15" refX="13" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,13 L14,6.5 z" fill="#b91c1c"/>
    </marker>
    <filter id="shadow" x="-8%" y="-14%" width="116%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <linearGradient id="imageGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Times New Roman", Times, serif; font-size: 48px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: "Times New Roman", Times, serif; font-size: 24px; fill: #475569; }
      .section { font-family: "Times New Roman", Times, serif; font-size: 22px; font-weight: 800; fill: #334155; }
      .h { font-family: "Times New Roman", Times, serif; font-size: 28px; font-weight: 800; fill: #0f172a; }
      .h2 { font-family: "Times New Roman", Times, serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .body { font-family: "Times New Roman", Times, serif; font-size: 20px; fill: #334155; }
      .small { font-family: "Times New Roman", Times, serif; font-size: 17px; fill: #475569; }
      .smallBold { font-family: "Times New Roman", Times, serif; font-size: 17px; font-weight: 800; fill: #334155; }
      .formula { font-family: "Times New Roman", Times, serif; font-size: 19px; fill: #1f2937; }
      .num { font-family: "Times New Roman", Times, serif; font-size: 21px; font-weight: 800; fill: #ffffff; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.3; rx: 12; filter: url(#shadow); }
      .blueBox { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2.4; rx: 12; filter: url(#shadow); }
      .greenBox { fill: #dcfce7; stroke: #15803d; stroke-width: 2.4; rx: 12; filter: url(#shadow); }
      .amberBox { fill: #fef3c7; stroke: #b45309; stroke-width: 2.6; rx: 14; filter: url(#shadow); }
      .redBox { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2.5; rx: 12; filter: url(#shadow); }
      .purpleBox { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.4; rx: 12; filter: url(#shadow); }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.8; rx: 12; }
      .callout { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.3; rx: 12; filter: url(#shadow); }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 18; }
      .chipGray { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; rx: 18; }
      .chipGreen { fill: #bbf7d0; stroke: #15803d; stroke-width: 1.5; rx: 18; }
      .mini { fill: #ffffff; stroke: #d97706; stroke-width: 1.8; rx: 10; }
      .guideBlue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.8; rx: 18; }
      .guideGreen { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.8; rx: 18; }
      .guideRed { fill: #fef2f2; stroke: #fecaca; stroke-width: 1.8; rx: 18; }
      .arrowBlue { fill: none; stroke: #0369a1; stroke-width: 4.2; marker-end: url(#arrowBlue); }
      .arrowGreen { fill: none; stroke: #15803d; stroke-width: 4.2; marker-end: url(#arrowGreen); }
      .arrowDark { fill: none; stroke: #1f2937; stroke-width: 4.2; marker-end: url(#arrowDark); }
      .arrowRed { fill: none; stroke: #b91c1c; stroke-width: 4.2; marker-end: url(#arrowRed); }
      .thinArrowDark { fill: none; stroke: #1f2937; stroke-width: 3.2; marker-end: url(#arrowDark); }
      .dash { stroke-dasharray: 13 10; }
      .gridLine { stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1400"/>

  <text class="title" x="72" y="72">FOCUS-OVD 模型示意图</text>
  <text class="subtitle" x="76" y="112">重点：方向感知模块先估计局部旋转方向，再用 Fourier 编码调制 small-vehicle 的 support 残差。</text>

  <rect class="note" x="72" y="142" width="2256" height="78"/>
  <text class="section" x="104" y="188">图示说明</text>
  <text class="body" x="238" y="178">蓝色：图像前向流；绿色：原生 support 分支；黑色：方向编码进入残差适配器；</text>
  <text class="body" x="238" y="204">红色虚线：训练与安全验证，只用于约束和筛选，不参与普通推理。</text>

  <!-- Background layers -->
  <rect class="guideBlue" x="58" y="260" width="2284" height="250"/>
  <rect class="guideGreen" x="58" y="545" width="2284" height="420"/>
  <rect class="guideRed" x="58" y="1025" width="2284" height="250"/>

  <text class="section" x="90" y="292">第一层：图像前向流</text>
  <text class="section" x="90" y="582">第二层：support 分支与 FOCUS 核心</text>
  <text class="section" x="90" y="1062">第三层：训练证据与安全门</text>

  <!-- Forward row -->
  <rect class="box" x="90" y="330" width="270" height="140"/>
  <circle cx="126" cy="364" r="19" fill="#334155"/>
  <text class="num" x="121" y="371">1</text>
  <text class="h" x="164" y="374">遥感图像</text>
  <text class="body" x="128" y="410">旋转目标 / 多角度</text>
  <rect x="130" y="426" width="128" height="36" rx="7" fill="url(#imageGrad)" stroke="#64748b" stroke-width="1.4"/>
  <path d="M138 456 L168 438 L206 444 L252 434" stroke="#94a3b8" stroke-width="7" fill="none" opacity="0.66"/>
  <g transform="translate(184 445) rotate(-29)">
    <rect x="-19" y="-5" width="38" height="10" rx="2" fill="#0369a1"/>
    <rect x="-12" y="-8" width="24" height="5" rx="2" fill="#38bdf8"/>
  </g>

  <rect class="blueBox" x="450" y="330" width="330" height="140"/>
  <circle cx="486" cy="364" r="19" fill="#0369a1"/>
  <text class="num" x="481" y="371">2</text>
  <text class="h" x="524" y="374">冻结 OpenRSD</text>
  <text class="body" x="488" y="410">DINOv2 / A10 backbone</text>
  <text class="body" x="488" y="440">FPN + RTMDet head</text>
  <rect class="chipGray" x="658" y="435" width="82" height="26"/>
  <text class="smallBold" x="681" y="453">冻结</text>

  <rect class="blueBox" x="880" y="330" width="340" height="140"/>
  <text class="h" x="925" y="374">dense 特征</text>
  <text class="body" x="925" y="410">每个位置输出视觉 embedding</text>
  <text class="formula" x="925" y="444">z_l ∈ R^(H_l W_l × D)</text>

  <rect class="callout" x="1640" y="305" width="560" height="185"/>
  <text class="h" x="1682" y="350">重点强调三点</text>
  <text class="body" x="1682" y="388">1. 不替换原生 support bank</text>
  <text class="body" x="1682" y="424">2. 只给 small-vehicle 加残差</text>
  <text class="body" x="1682" y="460">3. α=0 时严格等价 baseline</text>

  <!-- Support branch -->
  <rect class="greenBox" x="90" y="650" width="330" height="150"/>
  <circle cx="126" cy="684" r="19" fill="#15803d"/>
  <text class="num" x="121" y="691">3</text>
  <text class="h" x="164" y="694">原生支持库</text>
  <text class="body" x="128" y="730">DINOv2/A10 support bank</text>
  <text class="body" x="128" y="760">support 特征 + 类别标签</text>
  <rect class="chipGray" x="128" y="770" width="132" height="26"/>
  <text class="smallBold" x="145" y="788">保留，不替换</text>

  <rect class="greenBox" x="520" y="650" width="330" height="150"/>
  <text class="h" x="566" y="694">原生映射</text>
  <text class="body" x="566" y="730">沿用 baseline 的 support 空间</text>
  <text class="formula" x="566" y="764">E = visual_fc(S)</text>
  <rect class="chipGray" x="566" y="774" width="154" height="26"/>
  <text class="smallBold" x="586" y="792">基线可回退</text>

  <!-- Direction sensing focus panel -->
  <rect class="amberBox" x="900" y="560" width="680" height="385"/>
  <circle cx="940" cy="604" r="22" fill="#b45309"/>
  <text class="num" x="935" y="612">4</text>
  <text class="h" x="980" y="615">方向感知模块（重点）</text>
  <text class="body" x="940" y="650">作用：把局部旋转方向变成残差适配器可用的条件编码。</text>

  <rect class="mini" x="930" y="685" width="138" height="190"/>
  <text class="h2" x="960" y="720">局部 patch</text>
  <text class="small" x="956" y="748">从 dense 特征</text>
  <text class="small" x="956" y="772">取 7×7 邻域</text>
  <g transform="translate(957 795)">
    <rect x="0" y="0" width="72" height="56" fill="#f8fafc" stroke="#94a3b8"/>
    <path class="gridLine" d="M24 0 V56 M48 0 V56 M0 18 H72 M0 37 H72"/>
    <g transform="translate(36 29) rotate(-32)">
      <rect x="-20" y="-5" width="40" height="10" rx="2" fill="#0369a1"/>
    </g>
  </g>

  <rect class="mini" x="1100" y="685" width="138" height="190"/>
  <text class="h2" x="1135" y="720">FFT</text>
  <text class="small" x="1120" y="748">计算频域</text>
  <text class="small" x="1120" y="772">方向能量</text>
  <g transform="translate(1169 823)">
    <circle cx="0" cy="0" r="36" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="6" fill="#d97706"/>
    <path d="M-30 0 H30 M0 -30 V30 M-22 -22 L22 22 M-22 22 L22 -22" stroke="#b45309" stroke-width="2"/>
    <circle cx="24" cy="-16" r="5" fill="#b91c1c"/>
    <circle cx="-24" cy="16" r="5" fill="#b91c1c"/>
  </g>

  <rect class="mini" x="1270" y="685" width="138" height="190"/>
  <text class="h2" x="1300" y="720">方向估计</text>
  <text class="small" x="1294" y="748">能量峰值</text>
  <text class="small" x="1294" y="772">得到 θ 和 c</text>
  <g transform="translate(1296 805)">
    <rect x="0" y="42" width="12" height="28" fill="#f59e0b"/>
    <rect x="20" y="34" width="12" height="36" fill="#f59e0b"/>
    <rect x="40" y="12" width="12" height="58" fill="#b91c1c"/>
    <rect x="60" y="30" width="12" height="40" fill="#f59e0b"/>
    <rect x="80" y="48" width="12" height="22" fill="#f59e0b"/>
    <path d="M46 5 L58 23 L34 23 Z" fill="#b91c1c"/>
  </g>

  <rect class="mini" x="1440" y="685" width="110" height="190"/>
  <text class="h2" x="1464" y="720">编码</text>
  <text class="small" x="1458" y="748">周期方向</text>
  <text class="small" x="1458" y="772">Fourier code</text>
  <text class="formula" x="1455" y="814">φ(θ)</text>
  <text class="formula" x="1455" y="846">sin/cos</text>

  <path class="thinArrowDark" d="M1068 780 H1100"/>
  <path class="thinArrowDark" d="M1238 780 H1270"/>
  <path class="thinArrowDark" d="M1408 780 H1440"/>
  <text class="formula" x="1020" y="920">输出：θ（方向） + c（置信度） + φ(θ)（给残差适配器）</text>

  <!-- Residual adapter and classifier -->
  <rect class="redBox" x="1700" y="630" width="405" height="250"/>
  <circle cx="1738" cy="668" r="21" fill="#b91c1c"/>
  <text class="num" x="1733" y="676">5</text>
  <text class="h" x="1778" y="678">方向条件残差适配器</text>
  <text class="body" x="1742" y="718">只改 small-vehicle 的 support 表示</text>
  <text class="formula" x="1742" y="758">Δ = α · c · MLP(φ)</text>
  <text class="formula" x="1742" y="796">E_focus = norm(E + Δ)</text>
  <rect class="chipGreen" x="1742" y="824" width="88" height="28"/>
  <text class="smallBold" x="1764" y="843">可训练</text>
  <rect class="chip" x="1844" y="824" width="92" height="28"/>
  <text class="smallBold" x="1862" y="843">零初始化</text>
  <rect class="chip" x="1950" y="824" width="92" height="28"/>
  <text class="smallBold" x="1968" y="843">范数裁剪</text>

  <rect class="purpleBox" x="2180" y="665" width="155" height="180"/>
  <text class="h" x="2210" y="712">OVD</text>
  <text class="h" x="2200" y="748">分类</text>
  <text class="body" x="2214" y="786">logits</text>
  <text class="small" x="2200" y="818">OBB 分数</text>

  <!-- Bottom evidence cards -->
  <rect class="note" x="110" y="1120" width="560" height="120"/>
  <text class="section" x="145" y="1160">训练信号</text>
  <text class="body" x="145" y="1193">false-SV 作为 anti negative</text>
  <text class="small" x="145" y="1222">true / missed SV 作为 preserve positive</text>

  <rect class="note" x="790" y="1120" width="560" height="120"/>
  <text class="section" x="825" y="1160">损失约束</text>
  <text class="body" x="825" y="1193">support distill + anti-attractor</text>
  <text class="small" x="825" y="1222">preserve + migration KL，防止类别漂移</text>

  <rect class="note" x="1530" y="1120" width="650" height="120"/>
  <text class="section" x="1565" y="1160">安全门</text>
  <text class="body" x="1565" y="1193">AP 不掉、真实 SV 保留、false-SV 下降</text>
  <text class="small" x="1565" y="1222">无检测爆炸时才推广，否则只作 ablation</text>

  <!-- Clean routed arrows -->
  <path class="arrowBlue" d="M360 400 H450"/>
  <text class="smallBold" x="382" y="382">图像流</text>
  <path class="arrowBlue" d="M780 400 H880"/>
  <text class="smallBold" x="806" y="382">视觉特征</text>
  <path class="arrowBlue" d="M1050 470 V560"/>
  <text class="smallBold" x="1066" y="526">送入方向感知</text>

  <path class="arrowGreen" d="M420 725 H520"/>
  <text class="smallBold" x="448" y="707">support</text>
  <path class="arrowGreen" d="M850 725 H870 V1000 H1660 V788 H1700"/>
  <text class="smallBold" x="1080" y="1032">原生 E 走直角通道进入残差适配器</text>

  <path class="arrowDark" d="M1580 760 H1700"/>
  <text class="smallBold" x="1605" y="742">φ、c</text>
  <path class="arrowRed" d="M2105 755 H2180"/>
  <text class="smallBold" x="2118" y="737">E_focus</text>

  <path class="arrowRed dash" d="M670 1180 H790"/>
  <path class="arrowRed dash" d="M1350 1180 H1530"/>
  <path class="arrowRed dash" d="M1070 1120 V1045 H1870 V880"/>
  <text class="smallBold" x="1280" y="1030">损失只约束核心残差模块</text>
  <path class="arrowRed dash" d="M2258 845 V1120"/>
  <text class="smallBold" x="2274" y="970">指标进入安全门</text>

  <!-- Core boundary -->
  <rect x="875" y="530" width="1255" height="445" rx="22" fill="none" stroke="#b91c1c" stroke-width="3.4" stroke-dasharray="16 12"/>
  <text class="smallBold" x="905" y="555">FOCUS-OVD 新增前向核心：方向感知模块 + 方向条件残差 support adapter</text>
</svg>
